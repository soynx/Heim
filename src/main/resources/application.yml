server:
  port: 8000
  # Trust X-Forwarded-* from a reverse proxy for scheme, host and client address.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: ${HEIM_SECURE_COOKIES:false}

spring:
  application:
    name: heim
  servlet:
    multipart:
      # Generous global cap so backup imports fit; individual endpoints enforce tighter limits.
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    problemdetails:
      enabled: false

heim:
  data-dir: ${HEIM_DATA_DIR:./data}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
