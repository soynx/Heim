services:
  heim:
    build: .
    image: heim:latest
    container_name: heim
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      HEIM_DATA_DIR: /data
      # Set to "true" for one start to clear login credentials and disable both login toggles.
      HEIM_RESET_AUTH: "false"
